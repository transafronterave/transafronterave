name: Actualizar catálogo
# Incremental: cada día actualiza las tiendas con la actualización más antigua (data/estado.json) hasta agotar --budget.
on:
  schedule: [{cron: "0 9 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: catalogo, cancel-in-progress: false}
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pillow
      - run: python3 scripts/catalogo.py --budget 40
        env: {CATALOGO_FUENTES: "${{ secrets.CATALOGO_FUENTES }}"}
      - run: python3 scripts/feed_meta.py
      - run: |
          git config user.name "transafronterave"; git config user.email "transafronterave@gmail.com"
          git add -A productos.json img data catalogo_meta.csv
          git diff --cached --quiet && exit 0
          git commit -m "Catálogo $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
