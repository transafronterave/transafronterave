name: Actualizar catálogo
on:
  schedule: [{cron: "0 9 * * 1"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: catalogo, cancel-in-progress: false}
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pillow
      - run: python3 scripts/catalogo.py
        env: {CATALOGO_FUENTES: "${{ secrets.CATALOGO_FUENTES }}"}
      - run: |
          git config user.name "transafronterave"; git config user.email "transafronterave@gmail.com"
          git add -A productos.json img
          git diff --cached --quiet && exit 0
          git commit -m "Catálogo semanal $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
